# Configuração do Netlify. A Vercel usa o vercel.json; o Netlify não lê esse arquivo.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Arquivo de /assets que não existe responde 404 (e não a página do app), para o app
# perceber que saiu versão nova. Esta regra vem antes da próxima e só vale quando o arquivo não existe.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# App de página única: links diretos (ex.: /saude/perto) precisam abrir o app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
